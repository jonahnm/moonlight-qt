name: Build - Linux AppImage (arm64)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ci_version:
        description: 'CI Version tag or build number'
        required: true
        default: 'dev'
        type: string
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick python3-pip libgbm-dev libdrm-dev \
            libfreetype-dev libasound2-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libglu1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxss-dev libxt-dev libxv-dev libxxf86vm-dev libxcb-dri3-dev \
            libx11-xcb-dev libxfixes-dev libxtst-dev wayland-protocols libopus-dev libvdpau-dev \
            libgl-dev libpipewire-0.3-dev liburing-dev libvulkan-dev vulkan-tools cmake ninja-build pkg-config
          sudo pip3 install meson
          mkdir -p dep_root/{bin,include,lib}
          echo "DEP_ROOT=$PWD/dep_root" >> "${GITHUB_ENV}"
          echo "$PWD/dep_root/bin" >> "${GITHUB_PATH}"
          
          # Force pkg-config to inspect all custom build locations
          echo "PKG_CONFIG_PATH=$PWD/dep_root/lib/pkgconfig:$PWD/dep_root/share/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=$PWD/dep_root/lib:/usr/local/lib:/usr/lib/aarch64-linux-gnu" >> "${GITHUB_ENV}"

      - name: Checkout SDL3
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.12
          path: deps/SDL

      - name: Build SDL3
        working-directory: deps/SDL
        run: |
          cmake -DSDL_KMSDRM=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_INSTALL_PREFIX=${{ env.DEP_ROOT }} -S . -B build
          cmake --build build -j
          sudo cmake --install build
      - name: Checkout sdl2-compat
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/sdl2-compat
          ref: release-2.32.50  # Changed from 2.32.70
          path: deps/sdl2-compat
          submodules: 'recursive'
  
      - name: Build sdl2-compat
        working-directory: deps/sdl2-compat
        run: |
          cmake -DSDL2COMPAT_TESTS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_INSTALL_PREFIX=${{ env.DEP_ROOT }} -DCMAKE_INSTALL_LIBDIR=lib -S . -B build
          cmake --build build -j
          sudo cmake --install build
          
          # Force system-wide pkg-config availability for qmake
          sudo mkdir -p /usr/share/pkgconfig
          if [ -f "${{ env.DEP_ROOT }}/lib/pkgconfig/sdl2-compat.pc" ]; then
            sudo cp ${{ env.DEP_ROOT }}/lib/pkgconfig/sdl2-compat.pc /usr/share/pkgconfig/sdl2.pc
          elif [ -f "/usr/local/lib/pkgconfig/sdl2-compat.pc" ]; then
            sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/share/pkgconfig/sdl2.pc
          fi

      - name: Checkout SDL_ttf
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: deps/SDL_ttf
          submodules: 'recursive'

      - name: Build SDL_ttf
        working-directory: deps/SDL_ttf
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Checkout libva
        uses: actions/checkout@v5
        with:
          repository: intel/libva
          ref: 2.24.1
          path: deps/libva

      - name: Build libva
        working-directory: deps/libva
        run: |
          ./autogen.sh
          ./configure --enable-x11
          make -j$(nproc)
          sudo make install
      - name: Checkout Vulkan-Headers
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.4.304
          path: deps/Vulkan-Headers

      - name: Build Vulkan-Headers
        working-directory: deps/Vulkan-Headers
        run: |
          cmake -S . -B build
          sudo cmake --install build
      - name: Checkout libplacebo
        uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: 2d0979fb54e025e904c7372666fffbf5dae40f66
          path: deps/libplacebo
          submodules: 'recursive'

      - name: Build libplacebo
        working-directory: deps/libplacebo
        run: |
          meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
          ninja -C build
          sudo ninja install -C build

      - name: Build dav1d
        working-directory: deps
        env:
          DAV1D_VER: 1.5.3
        run: |
          git clone --branch $DAV1D_VER --depth 1 https://code.videolan.org/videolan/dav1d.git
          pushd dav1d
          meson setup build -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
          ninja -C build
          sudo ninja install -C build
          popd

      - name: Checkout FFmpeg
        uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: n8.1.1
          path: deps/FFmpeg

      - name: Build FFmpeg
        working-directory: deps/FFmpeg
        env:
          PKG_CONFIG_PATH: /usr/local/share/pkgconfig:/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          ./configure --enable-pic --enable-lto --disable-static --enable-shared --disable-all --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-swscale \
            --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 \
            --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi \
            --enable-vdpau --enable-hwaccel=h264_vdpau  --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau \
            --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan \
            --enable-libdav1d --enable-decoder=libdav1d
          make -j$(nproc)
          sudo make install

      - name: Build PyroWave
        working-directory: pyrowave
        run: |
          ./checkout_granite.sh
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build Binaries
        env:
          EXTRA_QMAKE_FLAGS: "CONFIG+=pyrowave PKG_CONFIG_PATH=${{ env.DEP_ROOT }}/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig"
          PKG_CONFIG_PATH: "${{ env.DEP_ROOT }}/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig"
        run: |
          sudo ldconfig
          scripts/build-appimage.sh

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-arm64-${{ env.CI_VERSION }}
          path: build/installer-release/Moonlight-${{ env.CI_VERSION }}-aarch64.AppImage
          compression-level: 0
          if-no-files-found: error
